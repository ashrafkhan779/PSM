<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>PSM Order Overview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
--ink:#151E2B;--slate:#263449;--steel:#4C617D;--muted:#7C8BA1;
--ground:#E7ECF1;--panel:#FFFFFF;--line:#D7DEE8;--panel2:#F3F6FA;
--ember:#E0602B;
--ok:#1E8A6E;--okbg:#E4F1EC;
--flight:#3A76B8;--flightbg:#E6EEF8;
--hot:#C63F27;--hotbg:#F8E4DF;
--disp:"Space Grotesk",system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,monospace;--body:"Inter",system-ui,sans-serif;
}
*{box-sizing:border-box}html,body{margin:0;padding:0}
body{background:var(--ground);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
.app{display:grid;grid-template-columns:212px 1fr;min-height:100vh}
.rail{background:var(--slate);color:#C9D3E0;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{padding:20px 18px 16px;border-bottom:1px solid rgba(255,255,255,.08)}
.brand .tick{width:26px;height:5px;background:var(--ember);border-radius:2px;margin-bottom:12px}
.brand h1{font-family:var(--disp);font-size:15px;font-weight:700;color:#fff;margin:0;letter-spacing:.02em}
.brand p{margin:3px 0 0;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:#8496AC}
.nav{padding:12px 10px;display:flex;flex-direction:column;gap:2px;flex:1}
.nav button{all:unset;display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:8px;cursor:pointer;color:#AAB7C8;font-size:13.5px;font-weight:500;position:relative;transition:background .15s,color .15s}
.nav button svg{width:17px;height:17px;flex:none;opacity:.85}
.nav button:hover{background:rgba(255,255,255,.05);color:#EAF0F7}
.nav button.on{background:rgba(224,96,43,.14);color:#fff}
.nav button.on::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;background:var(--ember);border-radius:2px}
.nav button:focus-visible{outline:2px solid var(--ember);outline-offset:2px}
.railfoot{padding:14px 18px;font-size:10.5px;color:#6E7E93;border-top:1px solid rgba(255,255,255,.08);line-height:1.5}
.main{padding:22px 26px 40px;max-width:1220px;width:100%}
.topbar{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.topbar .hl h2{font-family:var(--disp);font-weight:600;font-size:22px;margin:0;color:var(--ink)}
.topbar .hl p{margin:4px 0 0;color:var(--steel);font-size:13px}
.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.search{position:relative;min-width:250px}
.search input{width:270px;border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:11px 34px 11px 38px;font-family:var(--body);font-size:13.5px;color:var(--ink)}
.search input:focus{outline:2px solid var(--ember);outline-offset:1px;border-color:transparent}
.search .ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--muted)}
.search .clr{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:20px;height:20px;border:0;background:var(--panel2);color:var(--steel);border-radius:50%;cursor:pointer;display:none;align-items:center;justify-content:center;font-size:13px;line-height:1;padding:0}
.search .clr:hover{background:var(--hotbg);color:var(--hot)}
.search .clr.show{display:flex}
.results{position:absolute;z-index:30;top:calc(100% + 6px);left:0;right:0;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 30px rgba(21,30,43,.14);max-height:320px;overflow:auto;display:none}
.results.show{display:block}
.results .rrow{padding:9px 13px;border-bottom:1px solid var(--panel2);cursor:pointer;display:flex;justify-content:space-between;gap:10px;align-items:center}
.results .rrow:hover{background:var(--panel2)}.results .rrow:last-child{border-bottom:0}
.results .rk{font-family:var(--mono);font-size:12.5px;color:var(--ink);font-weight:600}
.results .rt{font-size:11px;color:var(--muted)}
.results .rtag{font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--steel);background:var(--panel2);padding:2px 7px;border-radius:5px}
.btn{all:unset;cursor:pointer;font-family:var(--body);font-size:12.5px;font-weight:600;padding:10px 14px;border-radius:9px;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.btn svg{width:15px;height:15px}
.btn.primary{background:var(--slate);color:#fff}.btn.primary:hover{background:var(--ink)}
.btn.ghost{background:var(--panel);color:var(--slate);border:1px solid var(--line)}.btn.ghost:hover{border-color:var(--steel)}
.btn:focus-visible{outline:2px solid var(--ember);outline-offset:2px}
.btn.hide{display:none}
.exportwrap{position:relative}
.menu{position:absolute;z-index:40;top:calc(100% + 6px);right:0;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 30px rgba(21,30,43,.14);min-width:184px;padding:6px;display:none}
.menu.show{display:block}
.menu button{all:unset;display:flex;align-items:center;gap:10px;width:100%;box-sizing:border-box;padding:9px 11px;border-radius:7px;font-size:13px;color:var(--slate);cursor:pointer;font-weight:500}
.menu button:hover{background:var(--panel2)}
.menu button svg{width:15px;height:15px;color:var(--steel)}
.menu .mh{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:6px 11px 4px}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 13px;font-size:11.5px;color:var(--slate);display:flex;align-items:center;gap:7px;font-weight:500}
.chip b{font-family:var(--mono);font-weight:600;color:var(--ink)}
.chip.warn{background:#FCF3E8;border-color:#F0DBBE;color:#95611F}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
.kpis.k5{grid-template-columns:repeat(5,1fr)}
.kpis.k6{grid-template-columns:repeat(6,1fr)}.kpis.k6 .kpi{padding:14px 14px}
.kpi.qlink{cursor:pointer;transition:transform .15s ease,box-shadow .15s ease}
.kpi.qlink:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(21,30,43,.1)}
.kpi.qlink.on{outline:2px solid var(--ember);outline-offset:1px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 15px;position:relative;overflow:hidden}
.kpi .lab{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.kpi .val{font-family:var(--mono);font-size:23px;font-weight:600;color:var(--ink);margin-top:7px;letter-spacing:-.01em}
.kpi .sub{font-size:11.5px;color:var(--steel);margin-top:3px}
.kpi .bar{position:absolute;left:0;top:0;bottom:0;width:4px}
.kpi.hot .bar{background:var(--hot)}.kpi.ok .bar{background:var(--ok)}.kpi.flight .bar{background:var(--flight)}.kpi.neut .bar{background:var(--steel)}
.kpi.hot .val{color:var(--hot)}
.grid{display:grid;gap:14px}.g2{grid-template-columns:1.35fr 1fr}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 17px}
.card h3{font-family:var(--disp);font-size:13.5px;font-weight:600;margin:0 0 2px;color:var(--slate)}
.card .cap{font-size:11.5px;color:var(--muted);margin:0 0 14px}
.heat{display:flex;height:34px;border-radius:8px;overflow:hidden;border:1px solid var(--line)}
.heat span{display:flex;align-items:center;justify-content:center;color:#fff;font-size:11.5px;font-weight:600;font-family:var(--mono);min-width:0;transition:flex .4s}
.legend{display:flex;gap:16px;margin-top:12px;flex-wrap:wrap}
.legend div{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--steel)}
.legend i{width:11px;height:11px;border-radius:3px;display:inline-block}
.blist{display:flex;flex-direction:column;gap:11px}
.brow{display:grid;grid-template-columns:80px 1fr auto;align-items:center;gap:11px}
.brow .bn{font-size:12.5px;color:var(--slate);font-weight:500}
.brow .track{background:var(--panel2);border-radius:5px;height:22px;position:relative;overflow:hidden}
.brow .fill{height:100%;border-radius:5px;background:var(--flight)}
.brow .bv{font-family:var(--mono);font-size:12px;color:var(--ink);text-align:right;min-width:70px}
.rmk .brow{grid-template-columns:150px 1fr auto}.rmk .bn{white-space:normal;line-height:1.2}
.funnel{display:flex;flex-direction:column;gap:6px}
.fstep{display:grid;grid-template-columns:120px 1fr 42px;align-items:center;gap:10px}
.fstep .fn{font-size:12px;color:var(--slate)}.fstep .fbar{height:26px;border-radius:6px;background:var(--flightbg);position:relative;overflow:hidden}
.fstep .ff{height:100%;background:var(--flight);border-radius:6px;opacity:.85}.fstep .fc{font-family:var(--mono);font-size:12.5px;text-align:right;color:var(--ink);font-weight:600}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel)}
td{padding:9px 10px;border-bottom:1px solid var(--panel2);color:var(--ink)}
tr:last-child td{border-bottom:0}tbody tr{cursor:pointer}tbody tr:hover{background:var(--panel2)}
.mono{font-family:var(--mono)}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:3px 9px;border-radius:6px;white-space:nowrap}
.tag::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.9}
.t-ok{color:var(--ok);background:var(--okbg)}.t-flight{color:var(--flight);background:var(--flightbg)}.t-hot{color:var(--hot);background:var(--hotbg)}
.right{text-align:right}.center{text-align:center}
.tablewrap{max-height:440px;overflow:auto;border:1px solid var(--line);border-radius:10px}
.tablewrap.fit{max-height:none;overflow:visible}
.fittable{table-layout:fixed}
.fittable th,.fittable td{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:8px 8px}
.reptable th,.reptable td{font-size:10.5px;padding:6px 6px}
.reptable .kchip{font-size:9px;padding:2px 5px}
.reptable th.sortth{cursor:pointer;user-select:none;white-space:nowrap}
.reptable th.sortth:hover{color:var(--ember)}
.reptable th.sortth .sarr{font-size:9px;opacity:.7}
.statcards{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:14px;perspective:1200px}
.statcard{position:relative;overflow:hidden;background:linear-gradient(135deg,var(--c1),var(--c2));border-radius:16px;padding:18px 20px 16px;color:#fff;cursor:pointer;box-shadow:0 12px 26px -8px rgba(15,23,42,.45),inset 0 1px 0 rgba(255,255,255,.32);transition:transform .2s cubic-bezier(.22,.61,.36,1),box-shadow .2s;transform-style:preserve-3d}
.statcard::before{content:"";position:absolute;top:-40%;right:-20%;width:140px;height:140px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.28),transparent 70%);pointer-events:none}
.statcard::after{content:"";position:absolute;left:0;right:0;bottom:0;height:38%;background:linear-gradient(to top,rgba(0,0,0,.16),transparent);pointer-events:none}
.statcard:hover{transform:translateY(-5px) rotateX(4deg);box-shadow:0 20px 38px -10px rgba(15,23,42,.55),inset 0 1px 0 rgba(255,255,255,.4)}
.statcard.on{outline:3px solid #fff;outline-offset:-3px;transform:translateY(-3px) scale(1.015)}
.statcard .scname{font-size:12.5px;font-weight:600;letter-spacing:.02em;opacity:.96;position:relative}
.statcard .scval{font:700 27px/1 var(--mono);letter-spacing:-.02em;margin:9px 0 12px;position:relative;text-shadow:0 1px 2px rgba(0,0,0,.18)}
.statcard .scdet{display:flex;gap:16px;font-size:12px;opacity:.95;position:relative}
.statcard .scdet b{font-family:var(--mono);font-weight:700;font-size:14px;display:block;line-height:1.1}
@media(max-width:1000px){.statcards{grid-template-columns:repeat(2,1fr)}}
.tablewrap table th{border-bottom:1px solid var(--line)}
/* timeline (fixed logical sequence) */
.tl{display:flex;align-items:flex-start;margin:22px 4px 6px;position:relative}
.tl .stg{flex:1;position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;padding:0 4px}
.tl .seg{position:absolute;top:9px;left:-50%;width:100%;height:3px;background:var(--line);z-index:0}
.tl .stg:first-child .seg{display:none}
.tl .seg.done{background:var(--flight)}
.tl .dot{width:19px;height:19px;border-radius:50%;background:#fff;border:3px solid var(--line);z-index:1}
.tl .stg.done .dot{border-color:var(--flight);background:var(--flight)}
.tl .stg.ok .dot{border-color:var(--ok);background:var(--ok)}
.tl .stg.hot .dot{border-color:var(--hot);background:var(--hot)}
.tl .nm{margin-top:9px;font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:600}
.tl .dt{font-family:var(--mono);font-size:11.5px;color:var(--ink);margin-top:3px}
.tl .stg.hot .dt{color:var(--hot);font-weight:600}.tl .stg.ok .dt{color:var(--ok);font-weight:600}
.tlnote{font-size:11.5px;color:var(--steel);margin-top:12px;text-align:center}
.tlnote b{color:var(--ink)}
.pohead{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin:16px 0 4px}
.pohead .m{background:var(--panel2);border-radius:9px;padding:11px 12px}
.pohead .m .l{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.pohead .m .v{font-family:var(--mono);font-size:16px;font-weight:600;margin-top:4px;color:var(--ink)}
.filters{display:flex;gap:6px;align-items:center;flex-wrap:nowrap;margin-bottom:12px}
.fgroup{display:flex;align-items:center;gap:0;flex:1 1 0;min-width:0}
.fgroup .pill{background:var(--slate);color:#fff;font-family:var(--body);font-size:10px;letter-spacing:.03em;text-transform:uppercase;font-weight:600;padding:9px 8px;border-radius:8px 0 0 8px;white-space:nowrap;flex:none}
.fgroup select{border:1px solid var(--line);border-left:0;background:var(--panel);border-radius:0 8px 8px 0;padding:9px 8px;font-family:var(--mono);font-size:12px;color:var(--ink);min-width:0;width:100%;flex:1 1 0;text-overflow:ellipsis}
.filters .clearbtn{flex:none}
.yearbar{display:flex;align-items:center;gap:0;flex:none}
.yearbar .yl{background:var(--slate);color:#fff;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;height:42px;display:flex;align-items:center;padding:0 10px;border-radius:9px 0 0 9px;box-sizing:border-box}
.yearbar select{height:42px;border:1px solid var(--line);border-left:0;border-radius:0 9px 9px 0;background:var(--panel);font-family:var(--mono);font-size:12.5px;color:var(--ink);padding:0 10px;cursor:pointer;box-sizing:border-box}
.yearbar select:focus{outline:2px solid var(--ember);outline-offset:1px}
.fgroup select:focus{outline:2px solid var(--ember);outline-offset:1px}
.fcount{font-size:11.5px;color:var(--muted);margin-left:2px}
.clearbtn svg{width:14px;height:14px}
.bcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:10px;margin-bottom:16px}
.bcard{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:11px 12px;cursor:pointer;transition:border-color .15s,box-shadow .15s;text-align:left;position:relative;overflow:hidden}
.bcard:hover{border-color:var(--steel)}
.bcard.on{border-color:var(--ember);box-shadow:0 0 0 2px rgba(224,96,43,.16)}
.bcard .bl{font-size:10px;letter-spacing:.03em;color:var(--muted);font-weight:600;text-transform:uppercase}
.bcard .bc{font-family:var(--mono);font-size:20px;font-weight:600;margin-top:6px;color:var(--ink)}
.bcard .bv{font-size:10.5px;color:var(--steel);margin-top:2px;font-family:var(--mono)}
.bcard.hot .bc{color:var(--hot)} .bcard.hot.on{border-color:var(--hot);box-shadow:0 0 0 2px rgba(198,63,39,.16)}
.bcard.all .bc{color:var(--flight)}
.empty{padding:60px 20px;text-align:center;color:var(--muted)}
.empty svg{width:40px;height:40px;opacity:.4;margin-bottom:12px}
.dbar{height:8px;border-radius:4px;background:var(--hot);min-width:3px}
.note{font-size:11.5px;color:var(--steel);background:var(--panel2);border-left:3px solid var(--ember);border-radius:0 8px 8px 0;padding:10px 13px;margin-top:14px;line-height:1.5}
.toast{position:fixed;bottom:20px;right:20px;background:var(--ink);color:#fff;padding:12px 16px;border-radius:10px;font-size:13px;box-shadow:0 10px 30px rgba(0,0,0,.2);z-index:100;opacity:0;transform:translateY(8px);transition:.25s;max-width:340px}
.toast.show{opacity:1;transform:translateY(0)}
.toast.err{background:var(--hot)}
@media(max-width:1000px){.app{grid-template-columns:1fr}.rail{position:static;height:auto;flex-direction:row;overflow:auto}.nav{flex-direction:row}.railfoot,.brand p{display:none}.kpis{grid-template-columns:repeat(2,1fr)}.kpis.k5{grid-template-columns:repeat(2,1fr)}.kpis.k6{grid-template-columns:repeat(2,1fr)}.g2{grid-template-columns:1fr}.pohead{grid-template-columns:repeat(3,1fr)}.search input{width:200px}.filters{flex-wrap:wrap}.fgroup{flex:1 1 140px}}
.rmk .brow{cursor:pointer;border-radius:6px}.rmk .brow:hover .bn{color:var(--ink)}.rmk .brow:hover .track{outline:1px solid var(--line)}.rmk .brow.sel .fill{background:var(--ember)}.rmk .brow.sel .bn{font-weight:700;color:var(--ink)}
.track .pct,.fbar .pct{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:var(--ink);text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 2px #fff;pointer-events:none;font-family:var(--mono)}
.blist.clik .brow{cursor:pointer;border-radius:6px}.blist.clik .brow:hover .bn{color:var(--ink)}.blist.clik .brow:hover .track{outline:1px solid var(--line)}.blist.clik .brow.sel .fill{background:var(--ember)}.blist.clik .brow.sel .bn{font-weight:700;color:var(--ink)}
.funnel.clik .fstep{cursor:pointer}.funnel.clik .fstep:hover .fn{color:var(--ink)}.funnel.clik .fstep:hover .fbar{outline:1px solid var(--line)}.funnel.clik .fstep.sel .ff{background:var(--ember);opacity:1}.funnel.clik .fstep.sel .fn{font-weight:700;color:var(--ink)}
td.mdesc{max-width:260px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
/* ===== QC status board ===== */
.qcgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin:14px 0}
.qccard{background:var(--panel);border:1px solid var(--line);border-left-width:4px;border-radius:12px;padding:16px 18px}
.qccard .qh{font:600 12px var(--body);color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.qccard .qv{font:600 26px/1.1 var(--mono);color:var(--ink);margin-top:6px;letter-spacing:-.02em}
.qccard .qs{font-size:12px;color:var(--steel);margin-top:4px}
.qc-ok{border-left-color:var(--ok)} .qc-wait{border-left-color:var(--ember)}
/* ===== Shipment Kanban ===== */
.kanban{display:grid;grid-template-columns:repeat(5,minmax(210px,1fr));gap:12px;margin-top:16px;overflow-x:auto;padding-bottom:6px}
.kcol{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:12px;min-height:120px;display:flex;flex-direction:column}
.kcol .khd{display:flex;align-items:center;gap:7px;margin-bottom:4px}
.kcol .kdot{width:8px;height:8px;border-radius:50%;flex:none}
.kcol .ktitle{font:600 12.5px/1.2 var(--disp);color:var(--slate)}
.kcol .kmeta{font-size:11px;color:var(--muted);font-family:var(--mono);margin-bottom:10px}
.kcards{display:flex;flex-direction:column;gap:9px;max-height:760px;overflow-y:auto;padding-right:3px}
.kcards::-webkit-scrollbar{width:7px}.kcards::-webkit-scrollbar-thumb{background:var(--line);border-radius:6px}.kcards::-webkit-scrollbar-track{background:transparent}
.kcard{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:11px 12px;cursor:pointer;transition:transform .16s ease,box-shadow .16s ease,border-color .16s ease}
.kcard:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(21,30,43,.09);border-color:var(--flight)}
.kcard.sel{border-color:var(--ember);box-shadow:0 0 0 1px var(--ember)}

<script>/* Shared cleaning engine — new "Database" schema, backward-compatible with the old one. */
function pick(row,...names){for(const n of names){for(const k in row){if(String(k).trim().toLowerCase()===n.trim().toLowerCase())return row[k];}}return null;}
function toDate(v){
  if(v==null||v==='')return null;
  if(v instanceof Date)return isNaN(v)?null:new Date(Date.UTC(v.getFullYear(),v.getMonth(),v.getDate()));
  if(typeof v==='number'){const d=new Date(Math.round((v-25569)*86400*1000));return isNaN(d)?null:new Date(Date.UTC(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate()));}
  const d=new Date(String(v).trim());return isNaN(d)?null:new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));
}
const iso=d=>d?d.toISOString().slice(0,10):null;
const monLabel=d=>d?d.toLocaleDateString('en-US',{month:'short',year:'numeric'}):null;
function parseTF(v){
  if(v==null||String(v).trim()==='')return{cat:'Unknown',rem:null,delay:null};
  const s=String(v);const m=s.match(/(\d+)/);const n=m?+m[1]:null;
  if(/delay\s+by/i.test(s))return{cat:'Delayed',rem:null,delay:n};        // "Delay By N Days" / "Material Delay By N Days" — real overdue
  if(/material ready/i.test(s))return{cat:'Ready',rem:0,delay:null};      // "Material Ready (On Time/Delay/Before Time)" — ready, not overdue
  if(/yet to confirm|promise date/i.test(s))return{cat:'Unconfirmed',rem:null,delay:null};
  if(/remaining/i.test(s))return{cat:'On Track',rem:n,delay:null};        // "On Time - N Remaining", "Future PO - N Remaining"
  if(/delay|overdue|late/i.test(s))return{cat:'Delayed',rem:null,delay:n};
  return{cat:'On Time',rem:0,delay:0};
}
function oldStatusStage(v){ // only for legacy STATUS text
  if(v==null)return'Scheduled';const s=String(v).trim().toLowerCase();
  if(s.includes('ship'))return'Shipped';if(s.includes('complete'))return'Completed';
  if(s.includes('qc submitted')||s.includes('parts ready'))return'QC Submitted';
  if(s.includes('qc approved')||s.includes('pickup'))return'Ready for Pickup';
  if(s.includes('approved'))return'Approved';return String(v).trim();
}
function deriveState(cur,stage,tfCat){
  const c=((cur==null?'':cur)+' '+(stage==null?'':stage)).toLowerCase();
  if(c.includes('shipped')||c.includes('delivered')||c.includes('complete'))return'Delivered - On Time';
  if(tfCat==='Delayed')return'Overdue';
  return'Pending - On Track';
}
function normalizeQCStatus(value){
  const status=String(value??'').trim();
  const key=status.toLowerCase().replace(/[^a-z0-9]/g,'');
  return ({notapplicable:'Not Applicable',poinprocess:'PO In-Process',qcapproved:'QC Approved',awaitingpsmapproval:'Awaiting PSM Approval'})[key]||status;
}
function buildDataset(rows){
  const recs=[];
  for(const row of rows){
    const poRaw=pick(row,'PSM PO#');if(poRaw==null||String(poRaw).trim()==='')continue;
    const po=String(Math.round(Number(poRaw))||poRaw).trim();
    const tfRawVal=pick(row,'Time Frame');const tf=parseTF(tfRawVal);
    // status + workflow stage + current ETA (revShip)
    const curStatus=pick(row,'Current Status'); const oldStatus=pick(row,'STATUS');
    const rtsRaw=pick(row,'ET RTS Date');
    let stage,revShip;
    if(curStatus!=null && String(curStatus).trim()!==''){ stage=String(curStatus).trim(); revShip=toDate(rtsRaw); }
    else { const d=toDate(oldStatus); if(d){stage='Scheduled';revShip=d;} else {stage=oldStatusStage(oldStatus);revShip=toDate(rtsRaw);} }
    { const sl=stage.toLowerCase(); if(sl==='material ready to ship')stage='Material Ready to Ship'; else if(sl==='in-process'||sl==='in process')stage='In-Process'; else if(sl==='shipped')stage='Shipped'; }
    const deliveryStatus=pick(row,'Delivery Status');
    const state=deriveState(curStatus!=null?curStatus:deliveryStatus, stage, tf.cat);
    const orderQty=Math.round(Number(pick(row,'Order Quantity'))||0);
    const value=Number(pick(row,'Total Value','Total Price'))||0;
    const unit=orderQty>0?value/orderQty:0;
    const pendRaw=pick(row,'Still to be delivered (qty)');
    let delivQ,pendQ;
    if(state==='Delivered - On Time'){delivQ=orderQty;pendQ=0;}
    else if(pendRaw!=null && String(pendRaw).trim()!=='' && !isNaN(Number(pendRaw))){pendQ=Math.round(Number(pendRaw));delivQ=Math.max(0,orderQty-pendQ);}
    else {pendQ=orderQty;delivQ=0;}
    const pendValue=+(pendQ*unit).toFixed(2);
    const poDate=toDate(pick(row,'PSM PO DATE'));
    const lineNo=pick(row,'Line Item#');
    recs.push({
      po,line:lineNo==null?null:Math.round(Number(lineNo)),
      material:String(pick(row,'Material#')??'').trim(),
      desc:String(pick(row,'Material Description')??''),
      product:(()=>{const p=pick(row,'Products');return p==null||String(p).trim()===''?'Unspecified':String(p).trim();})(),
      plant:String(pick(row,'Supplying Plant')??''),supplier:String(pick(row,'Supplier')??''),
      buyer:String(pick(row,'Buyer')??'').trim(),category:String(pick(row,'PO Category')??'').trim(),rmStatus:String(pick(row,'RM Status')??'').trim(),
      remarks:String(pick(row,'Remarks')??'').trim(),
      tfRaw:tfRawVal==null?'':String(tfRawVal).trim(),
      orderUnit:String(pick(row,'Order Unit')??'').trim(),
      unitPrice:Number(pick(row,'Unit Price','Net Price'))||0,
      currency:String(pick(row,'Currency')??'').trim(),
      qcStatus:normalizeQCStatus(pick(row,'QC Status')),
      qcSubmitted:iso(toDate(pick(row,'QC Submitted date','QC Submitted Date','QC Submission date'))),
      qcApproved:iso(toDate(pick(row,'QC Approval date','QC Approval Date','QC Approved date'))),
      shipStatus:String(pick(row,'Shipment Status')??'').trim(),
      freightType:String(pick(row,'Freight Type')??'').trim(),
      freightPO:String(pick(row,'Freight PO')??'').trim(),
      awb:String(pick(row,'AWB/BL No','AWB/BL','AWB')??'').trim(),
      eta:iso(toDate(pick(row,'ETA'))),
      state,stage,
      poDate:iso(poDate),reqDate:iso(toDate(pick(row,'PSM Required Date','PSM Delivery Date'))),
      expShip:iso(toDate(pick(row,'ET Promised Date','ET Expected Ship Date'))),
      actShip:iso(toDate(pick(row,'Actual Ship date','ET Actual Ship date'))),revShip:iso(revShip),
      orderQty,delivQty:delivQ,pendQty:pendQ,value:+value.toFixed(2),pendValue,
      delay:tf.delay==null?null:Math.round(tf.delay),remaining:tf.rem==null?null:Math.round(tf.rem),
      poMonth:monLabel(poDate)
    });
  }
  const dts=recs.map(r=>r.poDate).filter(Boolean).sort();
  const meta={supplier:(recs.find(r=>r.supplier)||{}).supplier||'—',plant:(recs.find(r=>r.plant)||{}).plant||'—',
    generated:new Date().toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}),
    poMin:dts[0]||null,poMax:dts[dts.length-1]||null};
  return{meta,records:recs};
}
if(typeof module!=='undefined')module.exports={buildDataset,parseTF,deriveState,toDate};
</script>

function niceMax(v){if(v<=0)return 1;const p=Math.pow(10,Math.floor(Math.log10(v)));const s=[1,1.5,2,2.5,3,4,5,6,8,10];const n=v/p;for(const m of s)if(n<=m)return m*p;return 10*p;}

function promisedSchedule(){

  const map={};open.forEach(x=>{const k=x.expShip.slice(0,7);(map[k]=map[k]||{over:0,ready:0,track:0});if(x.state==='Overdue')map[k].over+=x.pendValue;else if(x.stage==='Material Ready to Ship')map[k].ready+=x.pendValue;else map[k].track+=x.pendValue;});
  const months=Object.keys(map).sort().map(k=>{const d=new Date(k+'-01T00:00:00');const m=map[k];const tot=m.over+m.ready+m.track;return {k,label:d.toLocaleDateString('en-US',{month:'short',year:'2-digit'}),over:m.over,ready:m.ready,track:m.track,tot};});
  let run=0;months.forEach(m=>{run+=m.tot;m.cum=run;});
  const total=run||1,maxBar=Math.max(...months.map(m=>m.tot),1),niceL=niceMax(maxBar),niceR=niceMax(total);
  const W=1060,H=380,ml=66,mr=70,mt=26,mb=48,pw=W-ml-mr,ph=H-mt-mb,n=months.length,slot=pw/n,bw=Math.min(48,slot*0.62),bottom=mt+ph;

    lyl+=`<text x="${ml-8}" y="${gy+4}" font-size="11" fill="var(--muted)" text-anchor="end" font-family="var(--mono)">${usdK(niceL*t/4)}</text>`;
    ryl+=`<text x="${ml+pw+8}" y="${gy+4}" font-size="11" fill="var(--muted)" text-anchor="start" font-family="var(--mono)">${usdK(niceR*t/4)}</text>`;}
  let bars='';months.forEach((m,i)=>{const x0=xc(i)-bw/2;let yb=bottom;const seg=(val,col)=>{if(val<=0)return '';const h=(val/niceL)*ph;yb-=h;return `<rect x="${x0}" y="${yb.toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" fill="${col}" rx="1"><title>${m.label} · ${col==='var(--hot)'?'Overdue':col==='var(--flight)'?'Ready to Ship':'On Track'}: ${usd(val)}</title></rect>`;};bars+=seg(m.over,'var(--hot)')+seg(m.ready,'var(--flight)')+seg(m.track,'#98A6B9');});
  let path='',dots='';months.forEach((m,i)=>{const px=xc(i),py=yR(m.cum);path+=(i?'L':'M')+px.toFixed(1)+' '+py.toFixed(1)+' ';dots+=`<circle cx="${px.toFixed(1)}" cy="${py.toFixed(1)}" r="2.8" fill="var(--ink)"><title>Cumulative to ${m.label}: ${usdK(m.cum)}</title></circle>`;});
  const step=Math.ceil(n/11);let xl='';months.forEach((m,i)=>{if(i%step===0)xl+=`<text x="${xc(i).toFixed(1)}" y="${bottom+22}" font-size="11.5" fill="var(--muted)" text-anchor="middle">${m.label}</text>`;});
  const cur=new Date().toISOString().slice(0,7);const asof=months.findIndex(m=>m.k>=cur);let marker='';
  if(asof>0){const mx=(ml+asof*slot).toFixed(1);marker=`<line x1="${mx}" y1="${mt-4}" x2="${mx}" y2="${bottom}" stroke="var(--ember)" stroke-width="1.6" stroke-dasharray="6 4"/><text x="${(+mx+6)}" y="${mt+8}" font-size="12" fill="var(--ember)" font-weight="600">as-of month</text>`;}
  let hi='';if(psSel){const si=months.findIndex(m=>m.k===psSel);if(si>=0)hi=`<rect x="${(ml+si*slot).toFixed(1)}" y="${mt}" width="${slot.toFixed(1)}" height="${ph}" fill="var(--ember)" opacity="0.09"/>`;}
  let clicks='';months.forEach((m,i)=>{clicks+=`<rect x="${(ml+i*slot).toFixed(1)}" y="${mt}" width="${slot.toFixed(1)}" height="${ph}" fill="transparent" style="cursor:pointer" onclick="psSelect('${m.k}')"><title>${m.label}: ${usdK(m.tot)} pending · click for lines</title></rect>`;});
  const svg=`<svg viewBox="0 0 ${W} ${H}" width="100%" preserveAspectRatio="xMidYMid meet" style="height:400px">${grid}${hi}${bars}${marker}<path d="${path}" fill="none" stroke="var(--ink)" stroke-width="2.4" stroke-linejoin="round"/>${dots}${lyl}${ryl}${xl}${clicks}</svg>`;
  const legend=`<div class="legend" style="margin-top:8px"><div><i style="background:var(--hot)"></i>Overdue</div><div><i style="background:var(--flight)"></i>Ready to Ship</div><div><i style="background:#98A6B9"></i>On Track</div><div><i style="background:var(--ink);height:3px;width:16px;border-radius:2px"></i>Cumulative pending</div></div>`;
  return `<div class="card" style="margin:14px 0"><h3>Promised delivery schedule</h3><p class="cap">Pending value by ET promised month, coloured by state, with cumulative pending. Months left of the as-of marker are overdue by definition. Click a month for its lines.</p>${svg}${legend}</div>`;

  const rows=Object.entries(map).sort((a,b)=>(+a[0])-(+b[0]));

     </tbody></table></div></div>`;

function poTimeline(all){
  const raised=all.map(x=>x.poDate).filter(Boolean).sort()[0];
  const required=all.map(x=>x.reqDate).filter(Boolean).sort()[0];
  const promised=all.map(x=>x.expShip).filter(Boolean).sort().slice(-1)[0];
  const rts=all.map(x=>x.revShip).filter(Boolean).sort().slice(-1)[0];
  const act=all.map(x=>x.actShip).filter(Boolean).sort().slice(-1)[0];
  const allDeliv=all.length>0&&all.every(x=>x.state==='Delivered - On Time');
  const anyOver=all.some(x=>x.state==='Overdue');
  const maxDelay=Math.max(0,...all.filter(x=>x.state==='Overdue').map(x=>x.delay||0));
  const finalCls=allDeliv?'ok':anyOver?'hot':'flight';
  const readyDone=!!(rts||act);
  const stages=[
    {nm:'PO raised',dt:raised,cls:'done'},
    {nm:'Required',dt:required,cls:'done'},
    {nm:'ET promised',dt:promised,cls:readyDone?'done':''},
    {nm:'Ready to ship',dt:rts,cls:readyDone?'done':''},
    {nm:act?'Actual ship':'Ship (pending)',dt:act,cls:finalCls+(allDeliv?' done':'')}
  ];
  const doneIdx=allDeliv?4:(rts?3:2);
  const html=stages.map((s,i)=>`<div class="stg ${s.cls}"><div class="seg ${i>0&&i<=doneIdx?'done':''}"></div><div class="dot"></div><div class="nm">${s.nm}</div><div class="dt">${fmtd(s.dt)}${i===4&&anyOver?` · +${maxDelay}d`:''}</div></div>`).join('');
  let note='';
  if(required&&promised){const dd=Math.round((new Date(promised)-new Date(required))/864e5);
    note = allDeliv ? `<b>Shipped.</b> Full PO shipped by ${fmtd(act)}.`
      : anyOver ? `<b>${maxDelay} days behind</b> on material — promised ship ${fmtd(promised)}.`
      : dd>0 ? `Promised ship is <b>${dd} days after</b> the required date — worth confirming with ${M.supplier}.`
      : `On track — promised ship ${fmtd(promised)}${rts?', ready-to-ship '+fmtd(rts):''}.`;}
  return `<div class="tl">${html}</div><div class="tlnote">${note}</div>`;
}

function stageProductMatrix(recs){
  const remOrder=['Yet to Start','Forging','Forging completed','Machining','Post Machining','Final Inspection','Awaiting QC approval','Ready for pickup.','Ready for pickup','Completed'];
  const prods=[...new Set(recs.map(x=>x.product))].filter(Boolean).sort();
  const remsPresent=[...new Set(recs.map(x=>(x.remarks&&x.remarks.trim())||'—'))];
  if(!prods.length||!remsPresent.length)return '<div class="empty">No data for the matrix.</div>';
  const rows=remOrder.filter(r=>remsPresent.some(rp=>rp.toLowerCase()===r.toLowerCase())).concat(remsPresent.filter(rp=>!remOrder.some(r=>r.toLowerCase()===rp.toLowerCase())));
  const val={};let maxCell=0;
  recs.forEach(x=>{const r=(x.remarks&&x.remarks.trim())||'—';const k=r+'|||'+x.product;val[k]=(val[k]||0)+x.pendValue;});
  Object.values(val).forEach(v=>{if(v>maxCell)maxCell=v;});
  const dark=document.documentElement.classList.contains('dark');
  const lo=dark?[24,33,46]:[233,238,244],hi=dark?[92,147,212]:[39,72,103];
  const heat=r=>{const t=Math.sqrt(Math.max(0,Math.min(1,r)));return `rgb(${Math.round(lo[0]+(hi[0]-lo[0])*t)},${Math.round(lo[1]+(hi[1]-lo[1])*t)},${Math.round(lo[2]+(hi[2]-lo[2])*t)})`;};
  const emptyBg=dark?'rgba(255,255,255,.03)':'#F6F8FB';
  let h=`<div class="smscroll"><div class="smatrix" style="grid-template-columns:150px repeat(${prods.length},minmax(120px,1fr))"><div></div>`;
  prods.forEach(p=>{h+=`<div class="smcol">${p}</div>`;});
  rows.forEach(r=>{h+=`<div class="smrowlab">${r}</div>`;
    prods.forEach(p=>{const v=val[r+'|||'+p]||0;const ratio=maxCell?v/maxCell:0;const sel=(curCellStage===r&&curCellProd===p);const light=v>0&&Math.sqrt(ratio)>0.55;
      h+=`<div class="smcell${sel?' sel':''}" style="background:${v>0?heat(ratio):emptyBg};color:${light?'#fff':(v>0?'var(--ink)':'transparent')}" onclick="matrixFilter('${r.replace(/'/g,"\\'")}','${p.replace(/'/g,"\\'")}')" title="${r} × ${p}: ${usd(v)}">${v>0?usdK(v):''}</div>`;});
  });
  return h+'</div></div>';
}

/* ================= AGING & DELAYS ================= */
const AGE=[{k:'b15',t:'Due ≤ 15 days',lo:0,hi:15},{k:'b30',t:'16 – 30 days',lo:16,hi:30},{k:'b45',t:'31 – 45 days',lo:31,hi:45},{k:'b60',t:'46 – 60 days',lo:46,hi:60},{k:'b90',t:'61 – 90 days',lo:61,hi:90},{k:'b90p',t:'90 days +',lo:91,hi:1e9}];
const AGE_ORDER=[{k:'overdue',t:'Overdue',c:'#C0512A'},{k:'b15',t:'Due ≤15d',c:'#E0894C'},{k:'b30',t:'16–30d',c:'#C0902E'},{k:'b45',t:'31–45d',c:'#8A9152'},{k:'b60',t:'46–60d',c:'#5E8567'},{k:'b90',t:'61–90d',c:'#5B7A9E'},{k:'b90p',t:'90d+',c:'#5C6B7D'},{k:'unconfirmed',t:'To be Updated',c:'#B8862B'},{k:'ready',t:'Ready to Ship',c:'#2E6FB0'}];
let ageBucket='all',ageMode='buckets',ageProd='__ALL__';
function agingRecs(){
  const today=Date.parse(new Date().toISOString().slice(0,10));
  return R.filter(x=>x.state!=='Delivered - On Time').map(x=>{
    const eta=x.revShip||x.expShip;
    let days=x.remaining!=null?x.remaining:(eta?Math.round((Date.parse(eta)-today)/864e5):null);
    let bucket;
    if(x.state==='Overdue')bucket='overdue';
    else if(x.stage==='Material Ready to Ship')bucket='ready';
    else if((x.tfRaw&&/yet to confirm|promise date/i.test(x.tfRaw))||days==null)bucket='unconfirmed';
    else{if(days<0)days=0;const b=AGE.find(a=>days>=a.lo&&days<=a.hi);bucket=b?b.k:'b90p';}
    return Object.assign({},x,{eta,days,bucket});
  });
}
function agingBar(recs){
  const rows=AGE_ORDER.map(b=>{const r=recs.filter(x=>x.bucket===b.k);return Object.assign({},b,{v:sum(r,x=>x.pendValue),n:r.length,u:sum(r,x=>x.pendQty)});});
  const mx=Math.max(...rows.map(r=>r.v),1);
  return `<div class="agechart">`+rows.map(b=>{const pct=b.v>0?Math.max(4,b.v/mx*100):0;const light=pct>=48;
    return `<div class="agerow ${ageBucket===b.k?'on':''}" onclick="setBucket('${b.k}')"><div class="agel">${b.t}</div><div class="agetrack"><div class="agefill" style="width:${pct}%;background:${b.c}"></div><span class="agetext" style="color:${light?'#fff':'var(--steel)'}">${b.n} lines · ${num(b.u)} EA</span></div><div class="agev">${usdK(b.v)}</div></div>`;}).join('')+`</div>`;
}
function renderAging(sel){
  $('#ttl').textContent='Aging & Delays';$('#sub').textContent='When open lines are due to ship — and what is already late';
  let recs=agingRecs();if(ageProd!=='__ALL__')recs=recs.filter(x=>x.product===ageProd);
  const prodOpts=[{v:'__ALL__',t:'All products'}].concat([...new Set(R.map(x=>x.product))].sort().map(p=>({v:p,t:p})));
  const filters=`<div class="filters">
     ${selectGroup('Product','agpr',prodOpts,ageProd,'onAgeProd')}
     <button class="btn ${ageMode==='delay'?'primary':'ghost'}" onclick="setMode('delay')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/></svg>Show delays</button>
     <button class="btn ${ageMode==='ontime'?'primary':'ghost'}" onclick="setMode('ontime')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6 9 17l-5-5"/></svg>Show on-time</button>
     ${clearBtn('clearAging')}</div>`;
  const chart=`<div class="card"><h3>Pending value by aging bucket</h3><p class="cap">Days remaining to the ET promised date, as of ${M.generated||'today'}. Click a bucket to filter.</p>${agingBar(recs)}</div>`;
  let content;
  if(ageMode==='delay'){content=groupBreakdown(recs.filter(x=>x.state==='Overdue'),'delay');}
  else if(ageMode==='ontime'){content=groupBreakdown(recs.filter(x=>x.state==='Pending - On Track'),'ontime');}
  else{
    let L=ageBucket==='all'?recs:recs.filter(x=>x.bucket===ageBucket);
    L=L.slice().sort((a,b)=>{if(a.days==null)return 1;if(b.days==null)return -1;return a.days-b.days;});
    const label=ageBucket==='all'?'All open lines':(AGE_ORDER.find(b=>b.k===ageBucket)||{}).t;
    content=`<div class="card"><h3>${label} <span class="fcount">${num(sum(L,x=>x.pendQty))} units · ${uniq(L,x=>x.po)} POs · ${usdK(sum(L,x=>x.pendValue))} pending</span></h3><p class="cap">Ship ETA uses ET RTS Date where the material is ready, otherwise ET Promised Date. Click a row to open its PO.</p>
     <div class="tablewrap"><table><thead><tr><th>PO #</th><th>Material</th><th>Product</th><th class="right">Pend qty</th><th class="right">Pend value</th><th>Ship ETA</th><th>Window</th><th>Status</th></tr></thead><tbody>
     ${L.length?L.map(x=>`<tr onclick="openPO('${x.po}')"><td class="mono">${x.po}</td><td class="mono">${x.material}</td><td>${x.product}</td><td class="right mono">${x.pendQty}</td><td class="right mono">${usd(x.pendValue)}</td><td class="mono">${fmtd(x.eta)}</td><td class="mono">${x.state==='Overdue'?`<span style="color:var(--hot)">+${x.delay||Math.abs(x.days||0)}d late</span>`:x.days==null?'—':'in '+x.days+'d'}</td><td><span class="tag ${STATE[x.state]}">${stateShort(x.state)}</span></td></tr>`).join('')
       :`<tr><td colspan="8" style="text-align:center;color:var(--muted);padding:24px">Nothing in this window.</td></tr>`}
     </tbody></table></div></div>`;
  }
  $('#view').innerHTML=filters+chart+content;
}
function groupBreakdown(recs,kind){
  const hot=kind==='delay';
  if(!recs.length)return `<div class="card"><div class="empty">No ${hot?'delayed':'on-track'} lines${ageProd!=='__ALL__'?' for '+ageProd:''}.</div></div>`;
  const byPO={},byMat={};
  recs.forEach(x=>{
    (byPO[x.po]=byPO[x.po]||{n:0,pv:0,pq:0,d:0,eta:null});const p=byPO[x.po];p.n++;p.pv+=x.pendValue;p.pq+=x.pendQty;p.d=Math.max(p.d,x.delay||0);if(x.eta&&(!p.eta||x.eta<p.eta))p.eta=x.eta;
    (byMat[x.material]=byMat[x.material]||{desc:x.desc,prod:x.product,n:0,pv:0,pq:0,d:0,eta:null});const m=byMat[x.material];m.n++;m.pv+=x.pendValue;m.pq+=x.pendQty;m.d=Math.max(m.d,x.delay||0);if(x.eta&&(!m.eta||x.eta<m.eta))m.eta=x.eta;});
  const poRows=Object.entries(byPO).sort((a,b)=>b[1].pv-a[1].pv);
  const matRows=Object.entries(byMat).sort((a,b)=>b[1].pv-a[1].pv);
  const mHead=hot?'Max delay':'Next ship';
  const mCell=m=>hot?`<td class="mono" style="color:var(--hot);font-weight:600">${m.d}d</td>`:`<td class="mono" style="color:var(--ok);font-weight:600">${fmtd(m.eta)}</td>`;
  const lineHead=hot?'Late lines':'On-time lines';
  const tail=hot?'at risk':'on schedule';
  const poT=`<div class="card"><h3>${hot?'Delays':'On-time'} by PO <span class="fcount">${poRows.length} POs · ${usdK(sum(poRows,r=>r[1].pv))} ${tail}</span></h3><p class="cap">Ranked by pending value — click to open the PO</p>
    <div class="tablewrap"><table><thead><tr><th>PO #</th><th class="center">${lineHead}</th><th class="right">Pend qty</th><th class="right">Pend value</th><th>${mHead}</th></tr></thead><tbody>
    ${poRows.map(([po,m])=>`<tr onclick="openPO('${po}')"><td class="mono">${po}</td><td class="center">${m.n}</td><td class="right mono">${num(m.pq)}</td><td class="right mono">${usd(m.pv)}</td>${mCell(m)}</tr>`).join('')}
    </tbody></table></div></div>`;
  const matT=`<div class="card"><h3>${hot?'Delays':'On-time'} by material <span class="fcount">${matRows.length} materials</span></h3><p class="cap">Ranked by pending value — click to trace the material</p>
    <div class="tablewrap"><table><thead><tr><th>Material</th><th>Description</th><th>Product</th><th class="center">${lineHead}</th><th class="right">Pend value</th><th>${mHead}</th></tr></thead><tbody>
    ${matRows.map(([mid,m])=>`<tr onclick="openMat('${mid}')"><td class="mono">${mid}</td><td>${m.desc}</td><td>${m.prod}</td><td class="center">${m.n}</td><td class="right mono">${usd(m.pv)}</td>${mCell(m)}</tr>`).join('')}
    </tbody></table></div></div>`;
  return `<div class="grid" style="gap:14px">${poT}${matT}</div>`;
}

let qcFilter='__ALL__';
function donutSVG(segs){
  const tot=segs.reduce((s,x)=>s+x.value,0)||1;const cx=95,cy=95,r=78,ri=48;let a0=-Math.PI/2,paths='';
  segs.forEach(s=>{if(s.value<=0)return;const frac=s.value/tot,a1=a0+frac*2*Math.PI;
    const x0=cx+r*Math.cos(a0),y0=cy+r*Math.sin(a0),x1=cx+r*Math.cos(a1),y1=cy+r*Math.sin(a1);
    const xi1=cx+ri*Math.cos(a1),yi1=cy+ri*Math.sin(a1),xi0=cx+ri*Math.cos(a0),yi0=cy+ri*Math.sin(a0);
    const lg=frac>0.5?1:0;
    paths+=`<path d="M ${x0.toFixed(1)} ${y0.toFixed(1)} A ${r} ${r} 0 ${lg} 1 ${x1.toFixed(1)} ${y1.toFixed(1)} L ${xi1.toFixed(1)} ${yi1.toFixed(1)} A ${ri} ${ri} 0 ${lg} 0 ${xi0.toFixed(1)} ${yi0.toFixed(1)} Z" fill="${s.color}"><title>${s.label}: ${usd(s.value)} (${(frac*100).toFixed(1)}%)</title></path>`;
    a0=a1;});
  return `<svg viewBox="0 0 190 190" width="190" height="190" style="flex:none">${paths}</svg>`;
}
function renderQC(){
  $('#ttl').textContent='QC Status';$('#sub').textContent='Quality-control approvals across the purchase book';
  const QC=R.filter(x=>x.qcStatus);

    return `<div class="kpi ${cls} qlink${qcFilter===fv?' on':''}" onclick="setQCf('${fv}')" title="Filter table to ${fv==='__ALL__'?'all QC lines':fv}"><div class="bar"></div><div class="lab">${label}</div><div class="val">${usdK(v)}</div><div class="sub">${num(recs.length)} lines · ${po} POs · ${num(u)} units · ${m} mat</div></div>`;};
  const approvedRecs=QC.filter(x=>x.qcStatus==='QC Approved');
  const waitRecs=QC.filter(x=>x.qcStatus==='Awaiting PSM Approval');
  const kpis=`<div class="kpis" style="grid-template-columns:repeat(3,1fr)">
    ${tile('All QC',QC,'neut','__ALL__')}
    ${tile('QC Approved',approvedRecs,'ok','QC Approved')}

  const opts=[{v:'__ALL__',t:'All QC statuses'}].concat(statuses.map(k=>({v:k,t:k})));
  const filters=`<div class="filters">${selectGroup('QC status','qcf',opts,qcFilter,'setQCf')}${clearBtn('clearQC')}</div>`;
  let L=qcFilter==='__ALL__'?QC:QC.filter(x=>x.qcStatus===qcFilter);
  L=L.slice().sort((a,b)=>(+b.po)-(+a.po)||(a.line||0)-(b.line||0));
  const chip=s=>s==='QC Approved'?'background:var(--okbg);color:var(--ok)':'background:var(--hotbg);color:var(--hot)';
  const qcDays=x=>{if(x.qcSubmitted&&x.qcApproved){const d=Math.round((Date.parse(x.qcApproved)-Date.parse(x.qcSubmitted))/864e5);return d+' d';}if(x.qcSubmitted&&!x.qcApproved){const d=Math.round((Date.now()-Date.parse(x.qcSubmitted))/864e5);return `<span style="color:var(--hot)">${d} d ⏳</span>`;}return '—';};
  const table=`<div class="card"><h3>QC line items <span class="fcount">${L.length} lines</span></h3><p class="cap">Submitted → approval dates and turnaround days. Click a row to open the full PO</p>
   <div class="tablewrap"><table><thead><tr><th>PO #</th><th class="center">Line</th><th>Material</th><th>Description</th><th>Product</th><th class="right">Qty</th><th class="right">Value</th><th>QC status</th><th>Submitted</th><th>Approved</th><th class="center">Days</th></tr></thead><tbody>
   ${L.length?L.map(x=>`<tr onclick="openPO('${x.po}')"><td class="mono">${x.po}</td><td class="center mono">${x.line??'—'}</td><td class="mono">${x.material}</td><td class="mdesc" title="${(x.desc||'').replace(/"/g,'&quot;')}">${x.desc||'—'}</td><td>${x.product}</td><td class="right mono">${num(x.orderQty)}</td><td class="right mono">${usd(x.value)}</td><td><span class="kchip" style="${chip(x.qcStatus)}">${x.qcStatus}</span></td><td class="mono">${fmtd(x.qcSubmitted)}</td><td class="mono">${fmtd(x.qcApproved)}</td><td class="center mono">${qcDays(x)}</td></tr>`).join(''):`<tr><td colspan="11" style="text-align:center;color:var(--muted);padding:24px">No QC lines.</td></tr>`}
   </tbody></table></div></div>`;
  const coverageStatuses=['QC Approved','Awaiting PSM Approval','PO In-Process','Not Applicable'];
  const coverageColors=['#1E8A6E','#E0602B','#98A6B9','#557FC2'];
  const segs=coverageStatuses.map((label,i)=>{
    const rows=R.filter(x=>x.qcStatus===label);
    return {label,value:sum(rows,x=>x.value),color:coverageColors[i],n:rows.length,po:uniq(rows,x=>x.po)};
  });
  const other=R.filter(x=>x.qcStatus&&!coverageStatuses.includes(x.qcStatus));
  const unspecified=R.filter(x=>!x.qcStatus);
  if(other.length)segs.push({label:'Other QC statuses',value:sum(other,x=>x.value),color:'#8A75B5',n:other.length,po:uniq(other,x=>x.po)});
  if(unspecified.length)segs.push({label:'Not specified',value:sum(unspecified,x=>x.value),color:'#CBD2DC',n:unspecified.length,po:uniq(unspecified,x=>x.po)});
  const dtot=segs.reduce((s,x)=>s+x.value,0)||1;
  const dleg=segs.map(s=>`<div class="dleg"><span class="dsw" style="background:${s.color}"></span><div><div class="dll">${s.label}</div><div class="dlv">${usdK(s.value)} · ${num(s.n)} lines · ${s.po} POs · ${(s.value/dtot*100).toFixed(1)}%</div></div></div>`).join('');
  const donutCard=`<div class="card" style="margin-top:14px"><h3>QC coverage</h3><p class="cap">QC Approved, Awaiting PSM Approval, PO In-Process and Not Applicable — share of committed value. Blank Excel statuses are shown as Not specified.</p><div class="donutwrap">${donutSVG(segs)}<div class="dlegend">${dleg}</div></div></div>`;
  $('#view').innerHTML=filters+kpis+donutCard+table;
}

  if(/(delivered|shipped).*(units|quantity)|units.*delivered/.test(s))return trTxt('Delivered or shipped quantity is <b>'+num(K.dq)+'</b> units.');
  if(/units.*pending|pending.*units|pending quantity/.test(s))return trTxt('Pending quantity is <b>'+num(K.qty-K.dq)+'</b> units.');
  if(/overdue units|units.*overdue/.test(s))return trTxt('There are <b>'+num(K.oq)+'</b> overdue units.');
  if(/lines.*delivered|delivered.*lines|lines.*shipped/.test(s))return trTxt('<b>'+K.D.length+'</b> lines are delivered or shipped.');
  if(/lines.*(pending|on track|track)/.test(s))return trTxt('<b>'+K.TK.length+'</b> lines are pending and on track.');
  if(/lines.*overdue|overdue.*lines|how many.*overdue/.test(s))return trTxt('<b>'+K.O.length+'</b> lines are overdue.');
  if(/completion.*(unit|percent)|unit completion|percentage.*unit/.test(s))return trTxt('Unit completion is <b>'+(K.qty?(K.dq/K.qty*100).toFixed(1):'0.0')+'%</b> ('+num(K.dq)+' of '+num(K.qty)+' units).');
  if(/completion.*value|value completion/.test(s))return trTxt('Value completion is <b>'+(K.book?(K.deliv/K.book*100).toFixed(1):'0.0')+'%</b> ('+usdF(K.deliv)+' of '+usdF(K.book)+').');
  if(/average delay|avg delay|mean delay/.test(s)){const dd=K.O.map(TR.dday).filter(v=>v!=null);return trTxt('Average delay across overdue lines is <b>'+(dd.length?(dd.reduce((a,b)=>a+b,0)/dd.length).toFixed(1):'0')+' days</b>.');}
  if(/share.*open value.*overdue|overdue.*share.*open/.test(s))return trTxt('Overdue value represents <b>'+(K.pend?(K.over/K.pend*100).toFixed(1):'0.0')+'%</b> of open value.');
  if(/share.*lines.*overdue|overdue.*share.*lines/.test(s))return trTxt('Overdue lines represent <b>'+(K.lines?(K.O.length/K.lines*100).toFixed(1):'0.0')+'%</b> of all lines.');
  return null;
}

function answerQuery(qRaw){
  const s=aiNormalize(qRaw);
  try{const _tr=trAns(qRaw);if(_tr!=null)return _tr;}catch(e){}
  if(/\bexecutive\b|exec summary|leadership (summary|brief|report)|board (summary|report)|management summary|briefing|health check|health score|full (summary|report)/.test(s))return aiExecSummary();
  const nums=qRaw.match(/\d{4,}/g)||[];
  let poHit=nums.find(n=>R.some(x=>x.po===n));
  if(!poHit){for(const n of nums){if(n.length>=4){const c=[...new Set(R.filter(x=>x.po.endsWith(n)).map(x=>x.po))];if(c.length===1){poHit=c[0];break;}}}}
  if(poHit && !/^(chart|list|how|count|value|total)/.test(s)){aiCtx=null;const L=R.filter(x=>x.po===poHit);return {html:`<div class="aitrace">🔎 Found PO ${poHit} · ${L.length} line${L.length===1?'':'s'} · pulling every field</div>`+aiPO(poHit)};}
  const followWord=/^(now|then|and|also|ok|okay|what about|how about|same|again|instead)\b|\b(as a|in a|make it a|show as|turn into|convert to)\b|\bchart it\b|\blist (them|those)\b|\b(those|them) (po|order|line|as)/.test(s);
  const f0=parseFilters(s);
  let f=f0,usedCtx=false;
  if(followWord && aiCtx && aiCtx.f){f=Object.assign({},aiCtx.f,f0);usedCtx=true;}
  let scope=R.slice(),desc=[];
  if(f.year){scope=scope.filter(x=>x.poDate&&x.poDate.slice(0,4)===f.year);desc.push(f.year);}
  if(f.state){scope=scope.filter(x=>x.state===f.state);desc.push(stateShort(f.state));}
  if(f.ship){scope=scope.filter(x=>shipNorm(x.shipStatus)===shipNorm(f.ship));desc.push(f.ship);}
  if(f.qc){scope=scope.filter(x=>x.qcStatus===f.qc);desc.push(f.qc);}
  if(f.product){scope=scope.filter(x=>x.product===f.product);desc.push(f.product);}
  if(f.buyer){scope=scope.filter(x=>x.buyer===f.buyer);desc.push(f.buyer);}
  if(f.freight){scope=scope.filter(x=>new RegExp(f.freight,'i').test(x.freightType));desc.push(f.freight+' freight');}
  if(f.category){scope=scope.filter(x=>(x.category||'').toLowerCase()===f.category.toLowerCase());desc.push(f.category);}
  if(f.rm){scope=scope.filter(x=>x.rmStatus===f.rm);desc.push('RM '+f.rm);}
  if(f.future){const t=new Date().toISOString().slice(0,10);scope=scope.filter(x=>(x.tfRaw&&/future po/i.test(x.tfRaw))||(x.poDate&&x.poDate>t));desc.push('future orders');}
  const label=desc.length?' — '+desc.join(' · '):'';
  let fmt=parseFormat(s);if(fmt==='auto'&&usedCtx&&aiCtx.fmt)fmt=aiCtx.fmt;
  const statusFilter=f.state||f.ship||f.qc||f.freight||f.rm||f.future;
  const groupFilter=f.product||f.buyer||f.category;
  aiCtx={f,fmt};
  const trace=`<div class="aitrace">🔎 Searched ${num(R.length)} lines · <b>${num(scope.length)}</b> matched${desc.length?' on '+aiEsc(desc.join(' · ')):''}${usedCtx?' · follow-up ↩':''}</div>`;
  const wrap=res=>typeof res==='string'?trace+res:{html:trace+res.html,chart:res.chart};
  if(!scope.length)return trace+`<p class="sub2">No lines matched${label||' that request'}. I checked status, product, buyer, freight, year and PO #. Try different wording or a PO number.</p>`;
  if(fmt==='chart'){const dim=chartDim(s,f);return wrap(aiChart(scope,dim,'Value by '+(AI_DIMNAME[dim]||dim)+label));}
  if(fmt==='count')return wrap(aiFigure(scope,s,label));
  const lineLevel=/\bline\b|\bitem\b|line item|material list|list of material/.test(s);
  if(statusFilter||fmt==='list'){return wrap(lineLevel?aiLineList(scope,'Lines'+label):aiPOList(scope,'POs'+label,(f.state==='Overdue'||f.ship||f.future)?(x=>x.pendValue):(x=>x.value)));}
  if(groupFilter){return wrap(`<h4>${aiEsc(desc.join(' · '))}</h4>${aiFigure(scope,'value',label).replace(/^<h4>.*?<\/h4>/,'')}${aiGroupTable(scope,'stage','Current status','').replace(/^<h4><\/h4><p class="sub2">.*?<\/p>/,'')}`);}
  if(/shipment|freight|transit|dispatch|awb/.test(s))return wrap(aiShipMatrix(scope,label));
  if(/\bqc\b|quality/.test(s)){const QC=scope.filter(x=>x.qcStatus);return wrap(QC.length?aiGroupTable(QC,'qcStatus','QC status','QC status'+label):('No QC-status lines'+label+'.'));}
  if(/how many|count|number|how much|value|worth|total/.test(s))return wrap(aiFigure(scope,s,label));
  if(/summary|overview|dashboard|kpi|status|picture|health/.test(s))return wrap(`<h4>Book summary${label}</h4>${aiKpis(scope)}${aiGroupTable(scope,'product','Product','').replace(/^<h4><\/h4>/,'')}`);
  return wrap(`<h4>Here's the picture${label}</h4><p class="sub2">Ask me to <b>list</b>, <b>count</b>, <b>chart</b> or get <b>full detail</b> — filter by status (overdue, in-transit, QC approved…), product, buyer, freight, year or a PO #. I also handle typos and follow-ups like "now as a chart".</p>${aiKpis(scope)}`);
}

let repYear='__ALL__',repWeek='__ALL__',repStat='__ALL__',repSortKey=null,repSortDir=1;
function isoWeek(d){const dt=new Date(Date.UTC(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate()));const day=dt.getUTCDay()||7;dt.setUTCDate(dt.getUTCDate()+4-day);const ys=new Date(Date.UTC(dt.getUTCFullYear(),0,1));const wk=Math.ceil((((dt-ys)/86400000)+1)/7);return {year:dt.getUTCFullYear(),week:wk};}
function repEff(x){const shipped=x.stage==='Shipped'||!!x.actShip;const d=shipped?x.actShip:(x.expShip||null);return {d,shipped};}
function repWeekKey(ds){const d=new Date(ds+'T00:00:00Z');const iw=isoWeek(d);return iw.year+'-W'+String(iw.week).padStart(2,'0');}
function repStatus(x){const st=(x.stage||'').trim();
  if(/^shipped$/i.test(st))return 'Shipped';
  if(/under\s*clarification/i.test(st))return 'Under Clarification';
  if(/material ready to ship/i.test(st))return 'Material Ready to Ship';
  if(/in.?process/i.test(st))return 'In-Process';
  if(!x.expShip)return 'Under Clarification';
  return st||'In-Process';}
const REP_ORDER={'Shipped':0,'Material Ready to Ship':1,'In-Process':2,'Under Clarification':3};
function repShipped(x){return repStatus(x)==='Shipped';}
function repRows(){
  return ALLR.filter(x=>{
    const shipped=repShipped(x);const unconf=(repStatus(x)==='Under Clarification');
    if(repWeek==='__UNCONF__')return unconf;
    if(repWeek!=='__ALL__'){ if(shipped)return !!x.actShip&&repWeekKey(x.actShip)===repWeek; return true; }
    if(repYear!=='__ALL__'){ if(shipped)return !!x.actShip&&(''+new Date(x.actShip+'T00:00:00Z').getUTCFullYear())===repYear; return true; }
    return true;});
}
function repYearOpts(){const ys=[...new Set(ALLR.map(x=>{const e=repEff(x);return e.d?(''+new Date(e.d+'T00:00:00Z').getUTCFullYear()):null;}).filter(Boolean))].sort();return [{v:'__ALL__',t:'All years'}].concat(ys.map(y=>({v:y,t:y})));}
function repWeekOpts(){
  const m={};ALLR.forEach(x=>{const e=repEff(x);if(!e.d)return;const d=new Date(e.d+'T00:00:00Z');const iw=isoWeek(d);if(repYear!=='__ALL__'&&(''+iw.year)!==repYear)return;const key=iw.year+'-W'+String(iw.week).padStart(2,'0');
    if(!m[key]){const mon=new Date(Date.UTC(iw.year,0,1+(iw.week-1)*7));mon.setUTCDate(mon.getUTCDate()-(mon.getUTCDay()||7)+1);m[key]={key,label:'Wk '+iw.week+' · '+mon.toLocaleDateString('en-US',{day:'2-digit',month:'short'})+(repYear==='__ALL__'?' '+iw.year:'')};}});
  const weeks=Object.values(m).sort((a,b)=>a.key<b.key?-1:1).map(w=>({v:w.key,t:w.label}));
  const hasUnconf=ALLR.some(x=>repStatus(x)==='Under Clarification');
  return [{v:'__ALL__',t:'All weeks'}].concat(weeks).concat(hasUnconf?[{v:'__UNCONF__',t:'Under clarification (no date)'}]:[]);
}
window.setRepYear=v=>{repYear=v;repWeek='__ALL__';renderReports();};

function repStatusChip(s){const M={'In-Process':['#3A76B8','rgba(58,118,184,.15)'],'Material Ready to Ship':['#159C9C','rgba(21,156,156,.16)'],'Shipped':['#1E8A6E','rgba(30,138,110,.16)'],'Under Clarification':['#C63F27','rgba(198,63,39,.15)']};const c=M[s]||['var(--steel)','var(--panel2)'];return `<span class="kchip" style="background:${c[1]};color:${c[0]};font-weight:600">${s}</span>`;}
function repSortedRows(rows){
  return rows.slice().sort((a,b)=>{
    if(repSortKey==='qc'){const av=a.qcStatus||'',bv=b.qcStatus||'';return (av<bv?-1:av>bv?1:0)*repSortDir;}
    if(repSortKey==='status'){const av=REP_ORDER[repStatus(a)]??9,bv=REP_ORDER[repStatus(b)]??9;return (av-bv)*repSortDir;}
    const oa=REP_ORDER[repStatus(a)]??9,ob=REP_ORDER[repStatus(b)]??9;if(oa!==ob)return oa-ob;
    const ea=repEff(a).d||'9999',eb=repEff(b).d||'9999';return ea<eb?-1:ea>eb?1:0;});
}

let aihMsgs=[];
function aihGroup(keyfn,metricfn){const g={};R.forEach(x=>{const k=keyfn(x);if(k==null||String(k).trim()==='')return;(g[k]=g[k]||[]).push(x);});return Object.entries(g).map(([k,a])=>({k,v:metricfn(a),n:a.length}));}
function aihMetric(s){
  if(/pending unit|pending qty|pending quantit/.test(s))return {fn:a=>sum(a.filter(x=>!TR.deliv(x)),x=>x.orderQty),u:'qty',name:'pending units'};
  if(/order quantit|order qty|quantity|units/.test(s))return {fn:a=>sum(a,x=>x.orderQty),u:'qty',name:'order quantity'};
  if(/overdue value|overdue/.test(s))return {fn:a=>sum(a.filter(TR.over),x=>x.value),u:'money',name:'overdue value'};
  if(/pending value|open value/.test(s))return {fn:a=>sum(a,x=>x.value)-sum(a.filter(TR.deliv),x=>x.value),u:'money',name:'pending value'};
  if(/po count|number of pos/.test(s))return {fn:a=>uniq(a,x=>x.po),u:'count',name:'PO count'};
  if(/line count|most lines|number of lines|\blines?\b/.test(s))return {fn:a=>a.length,u:'count',name:'line count'};
  if(/completion|percent/.test(s))return {fn:a=>{const q=sum(a,x=>x.orderQty);return q?sum(a.filter(TR.deliv),x=>x.orderQty)/q*100:0;},u:'pct',name:'completion %'};
  return {fn:a=>sum(a,x=>x.value),u:'money',name:'order value'};
}
function aihHead(title,g,unit){const top=g.slice().sort((a,b)=>b.v-a.v)[0];const f=aihFmt(unit);return `<h4>${aiEsc(title)}</h4><p class="sub2">${top?aiEsc(top.k)+' leads with '+f(top.v)+' · ':''}${g.length} groups · as of ${M.generated||'today'}</p>`;}
function aihChart(q){
  const s=aiNormalize(q);
  if(!/chart|graph|plot|show|which|top \d|highest|largest|most|versus|\bvs\b|mix|profile|dashboard|compare|trend|monthly|by (product|buyer|po|stage|month)/.test(s))return null;
  const MT=aihMetric(s);
  if(/unit price.*(quantity|qty)|price.*(vs|versus).*quant/.test(s)){const pts=R.map(x=>({x:x.orderQty,y:x.unitPrice})).filter(p=>p.x&&p.y);return {html:`<h4>Unit price vs order quantity</h4><p class="sub2">${pts.length} lines plotted</p>`,chart:{type:'scatter',points:pts,xlabel:'Order quantity',ylabel:'Unit price',xunit:'qty',unit:'money'}};}
  if(/product mix/.test(s)){const g=aihGroup(x=>x.product,a=>sum(a,x=>x.value)).sort((a,b)=>b.v-a.v);return {html:aihHead('Product mix by order value',g,'money'),chart:{type:'doughnut',labels:g.map(o=>o.k),values:g.map(o=>o.v),unit:'money'}};}
  if(/delivered.*(vs|versus).*pending unit/.test(s)){const P=[...new Set(R.map(x=>x.product))];return {html:`<h4>Delivered vs pending units by product</h4><p class="sub2">${P.length} products · as of ${M.generated||'today'}</p>`,chart:{type:'bar',labels:P,stacked:true,unit:'qty',datasets:[{label:'Delivered',data:P.map(p=>sum(R.filter(x=>x.product===p&&TR.deliv(x)),x=>x.orderQty)),color:'#1E8A6E'},{label:'Pending',data:P.map(p=>sum(R.filter(x=>x.product===p&&!TR.deliv(x)),x=>x.orderQty)),color:'#3A76B8'}]}};}
  if(/delivered.*(vs|versus).*pending value/.test(s)){const d=sum(R.filter(TR.deliv),x=>x.value);return {html:`<h4>Delivered vs pending value</h4>`,chart:{type:'bar',labels:['Delivered','Pending'],values:[d,sum(R,x=>x.value)-d],unit:'money'}};}
  if(/overdue.*(vs|versus).*on.?track/.test(s)){return {html:`<h4>Overdue vs on-track pending value</h4>`,chart:{type:'bar',labels:['Overdue','On track'],values:[sum(R.filter(TR.over),x=>x.value),sum(R.filter(TR.onTrack),x=>x.value)],unit:'money'}};}
  if(/monthly|plot month|by month|over time|trend/.test(s)){
    let mf=a=>sum(a,x=>x.value),u='money',nm='PO value';
    if(/required/.test(s)){mf=a=>sum(a,x=>x.orderQty);u='qty';nm='required qty';}
    else if(/promised/.test(s)){mf=a=>sum(a,x=>x.orderQty);u='qty';nm='promised qty';}
    else if(/actual|shipped/.test(s)){mf=a=>sum(a.filter(x=>x.actShip),x=>x.orderQty);u='qty';nm='shipped qty';}
    const g={};R.forEach(x=>{if(!x.poMonth)return;(g[x.poMonth]=g[x.poMonth]||[]).push(x);});
    const keys=Object.keys(g).sort((a,b)=>new Date('1 '+a)-new Date('1 '+b));
    return {html:`<h4>Monthly ${nm}</h4><p class="sub2">${keys.length} months · as of ${M.generated||'today'}</p>`,chart:{type:'line',labels:keys,values:keys.map(k=>mf(g[k])),unit:u,slabel:nm}};}
  if(/shipment status/.test(s)){const g=aihGroup(x=>x.shipStatus,a=>a.length).filter(o=>o.k);return {html:aihHead('Shipment status (lines)',g,'count'),chart:{type:'bar',labels:g.map(o=>o.k),values:g.map(o=>o.v),unit:'count'}};}
  if(/qc status/.test(s)){const g=aihGroup(x=>x.qcStatus,a=>a.length).filter(o=>o.k);return {html:aihHead('QC status (lines)',g,'count'),chart:{type:'bar',labels:g.map(o=>o.k),values:g.map(o=>o.v),unit:'count'}};}
  if(/freight/.test(s)){const g=aihGroup(x=>x.freightType,a=>a.length).filter(o=>o.k&&o.k.toUpperCase()!=='NA');return {html:aihHead('Freight type (lines)',g,'count'),chart:{type:'bar',labels:g.map(o=>o.k),values:g.map(o=>o.v),unit:'count'}};}
  if(/aging/.test(s)){const B=[['Due ≤15d',0,15],['16–30d',16,30],['31–45d',31,45],['46–60d',46,60],['61–90d',61,90],['90d+',91,1e9]];const L=R.filter(TR.onTrack);const vals=B.map(b=>sum(L.filter(x=>{const d=trAgeDays(x);return d!=null&&d>=b[1]&&d<=b[2];}),x=>x.value));return {html:`<h4>Aging profile — pending value</h4><p class="sub2">On-track pending by days remaining · as of ${M.generated||'today'}</p>`,chart:{type:'bar',labels:B.map(b=>b[0]),values:vals,unit:'money'}};}
  const topN=(s.match(/top (\d+)/)||[])[1];
  if(topN||/which po|by po\b|value concentration|overdue pos/.test(s)){const n=topN?+topN:10;const g=aihGroup(x=>x.po,MT.fn).sort((a,b)=>b.v-a.v).slice(0,n);return {html:`<h4>Top ${n} POs by ${MT.name}</h4><p class="sub2">${g[0]?'#1 '+g[0].k+' · '+aihFmt(MT.u)(g[0].v)+' · ':''}as of ${M.generated||'today'}</p>`,chart:{type:'bar',horiz:true,labels:g.map(o=>o.k),values:g.map(o=>o.v),unit:MT.u}};}
  let keyfn,dim;
  if(/buyer/.test(s)){keyfn=x=>x.buyer;dim='buyer';}
  else if(/production stage|manufactur|\bstage\b/.test(s)){keyfn=x=>(x.remarks||'').trim();dim='production stage';}
  else if(/categor/.test(s)){keyfn=x=>x.category;dim='PO category';}
  else {keyfn=x=>x.product;dim='product';}
  const g=aihGroup(keyfn,MT.fn).filter(o=>o.k).sort((a,b)=>b.v-a.v);
  return {html:aihHead(MT.name.charAt(0).toUpperCase()+MT.name.slice(1)+' by '+dim,g,MT.u),chart:{type:'bar',horiz:true,labels:g.map(o=>o.k),values:g.map(o=>o.v),unit:MT.u}};
}

function scopedTables(recs){

    ['Pending qty',num(sum(recs,x=>x.pendQty))],['Overdue lines',String(ov.length)],['Overdue value',usd(sum(ov,x=>x.pendValue))]];
  const pm={};recs.forEach(x=>{(pm[x.po]=pm[x.po]||{l:0,oq:0,pq:0,v:0,pv:0,ov:0,d:0});const m=pm[x.po];m.l++;m.oq+=x.orderQty;m.pq+=x.pendQty;m.v+=x.value;m.pv+=x.pendValue;if(x.state==='Overdue'){m.ov++;m.d=Math.max(m.d,x.delay||0);}});

  const mm={};recs.forEach(x=>{(mm[x.material]=mm[x.material]||{desc:x.desc,prod:x.product,l:0,pq:0,pv:0,ov:0,d:0});const m=mm[x.material];m.l++;m.pq+=x.pendQty;m.pv+=x.pendValue;if(x.state==='Overdue'){m.ov++;m.d=Math.max(m.d,x.delay||0);}});
  const byMat=Object.entries(mm).sort((a,b)=>b[1].pv-a[1].pv).map(([k,m])=>[k,m.desc,m.prod,m.l,num(m.pq),usd(m.pv),m.ov,m.ov?m.d+'d':'-']);
  const rm={};recs.forEach(x=>{(rm[x.product]=rm[x.product]||{l:0,oq:0,dq:0,pq:0,v:0,pv:0});const m=rm[x.product];m.l++;m.oq+=x.orderQty;m.dq+=x.delivQty;m.pq+=x.pendQty;m.v+=x.value;m.pv+=x.pendValue;});

  return {kpis,byPO,byMat,byProd,lines,multiProd:Object.keys(rm).length>1};
}

<script>
/* Shared procurement book. All authority is checked by PostgreSQL, not UI flags. */
(() => {
  'use strict';
  const el=id=>document.getElementById(id);

  let timer=null,channel=null,syncing=false,editVersion=0,lastError='',notice='',remoteRevision=null,syncState='Connecting';
  const message=s=>{el('authMessage').textContent=s;};
  function validate(ds){
    if(!ds || typeof ds.meta!=='object' || Array.isArray(ds.meta) || !ds.meta || !Array.isArray(ds.records) || !ds.records.length)throw new Error('Expected meta and a non-empty records array.');
    if(ds.records.length>20000)throw new Error('This MVP supports up to 20,000 lines per book.');
    for(const [i,r] of ds.records.entries()){
      if(!r||typeof r!=='object'||Array.isArray(r)||typeof r.po!=='string'||!r.po.trim())throw new Error(`Row ${i+1}: PO is required.`);
      for(const k of ['orderQty','delivQty','pendQty','value','pendValue'])if(typeof r[k]!=='number'||!Number.isFinite(r[k])||r[k]<0)throw new Error(`Row ${i+1}: invalid ${k}.`);

      // markup / handler delimiters instead of accepting untrusted HTML in imports.
      for(const [k,v] of Object.entries(r))if(typeof v==='string'&&(/[<>]/.test(v)||(k!=='desc'&&/["\\\r\n]/.test(v))||(/^(po|material)$/.test(k)&&/'/.test(v))||/&#(?:x[0-9a-f]+|[0-9]+);?|&(?:quot|apos|lt|gt);/i.test(v)))throw new Error(`Row ${i+1}: unsupported markup or quote in ${k}.`);
    }

    return structuredClone(ds);
  }
  function applyAccess(){
    const admin=role==='admin';
    document.querySelectorAll('[data-admin-only]').forEach(e=>{e.hidden=!admin;});
    if(!admin&&view==='data')view='overview';
  }
  function status(){el('cloudStatus').textContent=`${role||'No access'} · v${revision??'—'} · ${draft?'UNSAVED PREVIEW':syncState}${remoteRevision?' · New saved version available':''}`;}
  function errorText(e){
    const code=e?.code||'';let advice='';
    if(code==='PGRST202'||code==='42883')advice='Run supabase/04_fix_save_and_live_updates.sql in SQL Editor, then retry.';
    else if(code==='42501')advice='Sign in with one of the two confirmed admin emails. Run 02_check_users.sql to verify access.';
    else if(code==='40001')advice='Another admin saved first. Download your preview backup, then Refresh database and re-import your reconciled file.';
    else if(code==='23505')advice='The database reported a duplicate key. Copy the details below for diagnosis; your upload has not been discarded.';
    else if(code==='57014')advice='The database timed out. Refresh to check the saved revision before retrying.';

    if(typeof aihMsgs!=='undefined')aihMsgs=[];

  }
  function display(ds,preserve=false){const y=yearFilter;applyAccess();setDataset(structuredClone(ds));if(preserve&&y!=='__ALL__'){yearFilter=y;renderYearSel();applyYear(y);}status();}

    const ticket=epoch,edits=editVersion;
    const {data,error}=await client.rpc('psm_get_book');
    if(ticket!==epoch)return;
    if(automatic&&(draft||busy||edits!==editVersion))return;
    if(error)throw error;
    if(!data)throw new Error('No database response. Run 01_schema.sql first.');
    const next=data.records.length?validate({meta:data.meta,records:data.records}):{meta:data.meta||{},records:[]};

    remoteRevision=null;syncState='Auto updates on';display(saved,automatic);document.body.classList.remove('locked');el('authGate').hidden=true;el('cloudBar').hidden=false;
    if(!saved.records.length){if(role==='admin'){go('data');toast('Database is empty. Import initial-data.json, then save.');}else toast('The database is empty. Please ask an administrator to import data.');}
  }

        revision=data.revision;saved=payload;draft=null;editVersion++;remoteRevision=null;notice='Saved successfully. Viewers and other admins update automatically. You can now click Refresh database to reload the saved copy.';syncState='Auto updates on';display(saved);toast('Saved. Automatic updates are enabled for all signed-in users.');
      }catch(e){lastError=errorText(e);notice='Save was not confirmed. Your preview is retained.';toast('Save not confirmed. See the details in Update Data.',true);}
      finally{busy=false;if(ticket===epoch){status();if(view==='data')renderData();}}
    },
    async reload(){
      if(busy||role!=='admin')return;
      if(draft&&!confirm('Discard the unsaved preview and load the saved database?'))return;
      busy=true;
      try{editVersion++;await load();lastError='';notice='Database refreshed. All users continue to receive automatic updates.';toast('Loaded the latest saved version.');}catch(e){lastError=errorText(e);toast('Refresh failed. See the details in Update Data.',true);}
      finally{busy=false;if(view==='data'&&role)renderData();}
    },
    async signOut(){
      if(busy){toast('Please wait for the current operation.');return;}
      if(draft&&!confirm('Sign out and discard the unsaved preview?'))return;
      lock('Signing out…');
      try{const {error}=await client.auth.signOut({scope:'local'});if(error)throw error;location.reload();}
      catch(e){message('Sign-out failed: '+e.message+'. Use Sign out / switch account to retry.');el('gateSignOut').hidden=false;}
    }
  };
  window.addEventListener('online',sync);
  window.addEventListener('focus',sync);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)sync();});
  window.addEventListener('beforeunload',e=>{if(draft){e.preventDefault();e.returnValue='';}});
  el('gateSignOut').onclick=()=>window.PSM.signOut();
  el('loginForm').onsubmit=async e=>{
    e.preventDefault();if(!client)return;
    el('loginButton').disabled=true;message('Signing in…');
    try{
      const {data,error}=await client.auth.signInWithPassword({email:el('loginEmail').value.trim(),password:el('loginPassword').value});
      if(error)throw error;
      el('loginPassword').value='';await enter(data.session);
    }catch(err){message(err.message);}finally{el('loginButton').disabled=false;}
  };
  async function boot(){
    const c=window.PSM_CONFIG;
    if(!c||!/^https:\/\/[a-z0-9-]+\.supabase\.co\/?$/.test(c.supabaseUrl)||!c.supabaseKey||c.supabaseKey.includes('YOUR_')){
      message('Setup required: edit site/config.js with your Supabase project URL and publishable key. Follow START-HERE.md.');el('loginButton').disabled=true;return;
    }
    if(c.supabaseKey.startsWith('sb_secret_')){message('Wrong key: use a publishable key, never a secret key.');return;}
    if(c.supabaseKey.split('.').length===3){
      try{const claims=JSON.parse(atob(c.supabaseKey.split('.')[1].replace(/-/g,'+').replace(/_/g,'/')));if(claims.role!=='anon'){message('Wrong legacy key: only the anon key may be used in the browser.');return;}}
      catch{message('Invalid legacy API key. Copy the publishable key from Supabase.');return;}
    }
    if(!window.supabase){message('Supabase library did not load. Check your internet connection and reload.');return;}
    client=window.supabase.createClient(c.supabaseUrl,c.supabaseKey,{auth:{persistSession:true,storage:window.PSM_AUTH_STORAGE,autoRefreshToken:true,detectSessionInUrl:false,storageKey:'psm-'+new URL(c.supabaseUrl).hostname}});
    client.auth.onAuthStateChange((event,session)=>{
      if(event==='SIGNED_OUT'){lock('You have signed out.');el('gateSignOut').hidden=true;}
      else if(event==='SIGNED_IN'&&userId&&userId!==session?.user.id){lock('Account changed. Reloading…');location.reload();}
    });
    try{const {data,error}=await client.auth.getSession();if(error)throw error;await enter(data.session);}catch(e){message('Connection failed: '+e.message);}
  }
  boot();
})();

</script>
</body>
</html>
